# GRUB configuration for the Neptuno live ISO ESP (Secure Boot chain:
# shim → grubx64.efi → Fedora-signed kernel). Placeholders are substituted by
# iso/build-iso.sh from iso/neptuno.conf.
set timeout=5
search --no-floppy --set=root -l @ISO_LABEL@
menuentry "@OS_TITLE@" {
    linux /images/pxeboot/vmlinuz root=live:LABEL=@ISO_LABEL@ rd.live.image rd.live.overlay.overlayfs=1 enforcing=0 console=ttyS0,115200n8
    initrd /images/pxeboot/initrd.img
}
