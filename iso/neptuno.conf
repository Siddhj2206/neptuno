# Live ISO config — portable to finpilot (single source, bash-sourced)
#
# Sourced by iso/build-live.sh and Justfile. For forks, override via env:
#   IMAGE_NAME, DEFAULT_TAG, or edit the defaults below.
# Keep hard-coded fallbacks for `podman build .` without Justfile env.

IMAGE_NAME="${IMAGE_NAME:-neptuno}"
DEFAULT_TAG="${DEFAULT_TAG:-stable}"
ISO_LABEL="${ISO_LABEL:-$(echo "${IMAGE_NAME}" | tr '[:lower:]' '[:upper:]')}"
ISO_OUTPUT="${ISO_OUTPUT:-output/${IMAGE_NAME}-live.iso}"
LIVE_IMAGE="${LIVE_IMAGE:-localhost/${IMAGE_NAME}-live:${DEFAULT_TAG}}"
IMGREF="${IMGREF:-localhost/${IMAGE_NAME}:${DEFAULT_TAG}}"

# ── Purebuild engine ────────────────────────────────────────────────────────
# Pinned tacklebox commit that provides cmd/purebuild (pure-Go EROFS ISO).
# Update via `just bump-purebuild <new-sha>` or manual edit + rebuild.
TACKLEBOX_SHA="f3dd168bf15b235b554e497e7192a64a6563c4a4"
PUREBUILD_BIN=".build/purebuild/purebuild"
