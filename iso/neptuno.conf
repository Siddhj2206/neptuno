# Neptuno live ISO — single source of truth.
#
# Sourced by iso/build-iso.sh (host side) and iso/src/configure-live.sh
# (inside the live-env container, via /tmp/src/neptuno.conf). Every OS
# identity and installer setting lives here — if you change an image ref,
# a label, or a name, change it in this file only.

# ── OS identity ─────────────────────────────────────────────────────────────
OS_NAME="Neptuno"
OS_SLUG="neptuno"    # lowercase machine name (image names, hostnames, artifacts)
OS_DESC="Neptuno — a niri-based universal blue image"
OS_TITLE="Neptuno Live"
ISO_LABEL="NEPTUNO_LIVE"
ISO_OUTPUT="output/neptuno-live.iso"

# Payload: the bootc image embedded in the ISO and installed to disk.
# Defaults to the local build (matches Justfile DEFAULT_TAG=stable);
# override for testing (e.g. ghcr.io/siddhj2206/neptuno:stable)
IMGREF="localhost/neptuno:stable"

# ── Installer semantics (images.json / recipe.json) ─────────────────────────
# bootloader of the INSTALLED system (grub2 keeps Secure Boot; see ticket 02)
BOOTLOADER="grub2"
# ostree backend (composefs=false) → overlay additionalimagestore layout
COMPOSEFS="false"
FLATPAK_VAR_PATH="var/lib/flatpak"
# Wizard shows the user-creation step; fisherman useradds at install time
# (replaces GNOME initial-setup, which does not exist on a niri image)
NEEDS_USER_CREATION="true"
