# DMS-installer-compatible user environment (mirror of what dankinstall
# writes; GTK/Qt/portal vars ported from neptuno practice).
# Precedence note: these environment.d vars win for the systemd user
# session; niri's environment{} block (config.kdl) mirrors the same values
# for processes niri spawns directly. Change both together.
TERMINAL=ghostty
XDG_CURRENT_DESKTOP=niri
QT_QPA_PLATFORM=wayland
QT_QPA_PLATFORMTHEME=gtk3
QT_QPA_PLATFORMTHEME_QT6=gtk3
GDK_BACKEND=wayland
SDL_VIDEO_DRIVER=wayland
CLUTTER_BACKEND=wayland
GTK_USE_PORTAL=1
ELECTRON_OZONE_PLATFORM_HINT=auto
MOZ_ENABLE_WAYLAND=1
