# DMS-installer-compatible user environment (mirror of what dankinstall
# writes; GTK/Qt/portal vars ported from neptuno practice).
# These are the single source of truth for the session environment; niri
# inherits them, so its environment{} block only sets XDG_CURRENT_DESKTOP.
TERMINAL=ghostty
XDG_CURRENT_DESKTOP=niri
QT_QPA_PLATFORM=wayland
QT_QPA_PLATFORMTHEME=qt6ct
QT_QPA_PLATFORMTHEME_QT6=qt6ct
GDK_BACKEND=wayland
SDL_VIDEO_DRIVER=wayland
CLUTTER_BACKEND=wayland
GTK_USE_PORTAL=1
ELECTRON_OZONE_PLATFORM_HINT=auto
MOZ_ENABLE_WAYLAND=1
# DMS forces this to 1 unless it is already set; 0 keeps Qt's vsync-locked
# animation driver (only the "Scrolling" wallpaper needs the 1 behaviour).
# Workaround for duxlabs-dev/dux-shell#3837; drop it once that is fixed.
QSG_USE_SIMPLE_ANIMATION_DRIVER=0
