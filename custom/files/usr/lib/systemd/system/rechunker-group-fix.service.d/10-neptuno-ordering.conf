# The common overlay's legacy rechunker migration must run after local filesystems
# so its tmpfiles pass writes to the persistent /var subvolume. Its explicit
# Before=systemd-sysusers.service conflicts with that requirement: sysusers runs
# before local-fs-pre.target, which creates a cycle and can drop the /var mount.
#
# The migration unit invokes systemd-sysusers itself, so this ordering edge is
# redundant. Reset only that inherited list; retain the migration and its
# After=local-fs.target guarantee.
[Unit]
Before=
