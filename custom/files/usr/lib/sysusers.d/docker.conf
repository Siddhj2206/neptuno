# Declare the docker group for bootc lint.
#
# The docker-ce RPM creates the "docker" group ad-hoc at install time
# (plain getent/groupadd in %pre) which leaves an /etc/group entry with no
# declarative counterpart — `bootc container lint --fatal-warnings` fails
# with "Found /etc/group entry without corresponding systemd sysusers.d".
# Declaring it here keeps the image fully declarative; GID is auto (the
# baked group wins on install, nobody reads the number).
#
# Users opt into Docker and libvirt access with `ujust add-dev-groups`.
g docker - -
