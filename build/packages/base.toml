# Base system (doc/product.md 5.2): shells, CLI glue, power, security keys,
# containers, networking, Nix, and the system services that come with them.
#
# Every name is asserted installed after the transaction; a typo fails the
# build on purpose. Versions are not pinned: the daily rebuild floats them.

[fedora]
packages = [
    # --- shells and CLI glue --------------------------------------------------
    "fish",                          # default login shell
    "zsh",
    "bash-completion",
    "just",                          # runs /usr/share/neptuno/justfile (`neptuno`)
    "jq",
    "fzf",
    "gum",
    "tmux",
    "fastfetch",
    "git",
    "git-credential-libsecret",      # libsecret speaks to oo7 through the Secret Service
    "7zip-standalone",
    "distrobox",
    "NetworkManager-tui",

    # --- power and hardware ---------------------------------------------------
    "tuned",
    "tuned-ppd",                     # org.freedesktop.UPower.PowerProfiles for DMS
    "brightnessctl",
    "playerctl",
    "ddcutil",
    "lm_sensors",
    "powertop",
    "smartmontools",
    "libva-utils",
    "android-tools",
    "steam-devices",
    "evtest",
    "libinput",
    "xdg-user-dirs",

    # --- security keys --------------------------------------------------------
    "pam-u2f",
    "pamu2fcfg",
    "yubikey-manager",

    # --- containers (D4: rootless podman behind the docker CLI) ---------------
    "podman-docker",
    "docker-compose",

    # --- kept from today's image (D16) ----------------------------------------
    "input-remapper",
    "firewall-config",
    "NetworkManager-openvpn",
    "NetworkManager-openconnect",
    "openvpn",
    "fuse",                          # FUSE 2, for host AppImages
    "fuse-libs",
    "zenity",
    "tcpdump",

    # --- Nix (D7, Plan A: daemon with /var/lib/nix bind-mounted on /nix) ------
    "nix",
    "nix-core",
    "nix-daemon",
    "nix-system",
]

# Official Tailscale repository. Fedora 45 does not package tailscale. The repo
# is used only while building; install_third_party_repo_section removes it.
["third-party:tailscale-stable"]
repo_url = "https://pkgs.tailscale.com/stable/fedora/tailscale.repo"
repo_id = "tailscale-stable"
repo_file = "tailscale.repo"
packager = "Tailscale Inc"
packages = ["tailscale"]

# topgrade (owner's updater: bootc, Flatpak, Nix, firmware, containers in one
# run). Fedora does not package it; lilay/topgrade tracks upstream releases.
# ~/.config/topgrade.toml is seeded from /etc/skel.
["copr:lilay/topgrade"]
packages = ["topgrade"]

[services]
system = [
    "NetworkManager.service",
    "systemd-resolved.service",
    "firewalld.service",
    "bluetooth.service",
    "tuned.service",
    "tuned-ppd.service",
    "upower.service",
    "cups.socket",
    "cups.path",
    "avahi-daemon.service",          # printer discovery (D2)
    "fstrim.timer",
    "smartd.service",                # disk health; skips itself in VMs
    # Intel CPU support, enabled by base-atomic presets. On AMD each one exits
    # cleanly at boot (thermald and intel_lpmd: unsupported CPU; mcelog: a
    # Condition skips it when edac_mce_amd is loaded; a drop-in skips it in
    # VMs, where that module is absent).
    "thermald.service",
    "intel_lpmd.service",
    "mcelog.service",
    "fwupd-refresh.timer",
    "bootloader-update.service",     # keeps the Secure Boot shim current
    "tailscaled.service",
    # Nix (system_files/shared): the bind mount, then the daemon. The socket is
    # left off: rhbz#2525943 reports it failing under SELinux.
    "nix.mount",
    "nix-daemon.service",
    # Updates (section 10) and Flatpak (7.2, 17.3), all from system_files/shared.
    "neptuno-ensure-homes.service",   # homes Anaconda's bootc install leaves missing
    "bootc-fetch-apply-updates.timer",
    "neptuno-flatpak-preinstall.timer",
    "neptuno-flatpak-update.timer",
    "neptuno-appstream-refresh.timer",
]
disabled = [
    "lm_sensors.service",            # loads modules from an empty sysconfig; a no-op
]
user = [
    "xdg-user-dirs.service",         # creates ~/Documents etc. at first login
    "podman.socket",                 # rootless docker-compose (DOCKER_HOST)
    "neptuno-update-notify.path",
    "neptuno-update-notify.timer",
    "neptuno-nix-upgrade.timer",
    "neptuno-nix-clean.timer",
]
