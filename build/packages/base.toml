# Neptuno base package manifest — WM-agnostic desktop additions.
#
# Consumed by build/20-base.sh via build/scripts/read-packages + package-lib.sh:
#   [fedora]                 -> install_fedora_section (one dnf5 transaction)
#   ["copr:<owner>/<project>"] -> install_copr_sections (per-COPR; COPRs are
#                                 disabled by clean-stage.sh — AGENTS.md rule 3)
#
# Every entry is verified present post-install (assert gate in package-lib.sh);
# adding a package that does not exist FAILS the build on purpose.
#
# Silverblue already provides GNOME, audio, graphics, fonts, XDG portals,
# NetworkManager, Flatpak, firmware updates, and zram. Keep only Neptuno's
# additions here. Multimedia is in multimedia.toml; Niri/DMS is in niri.toml.

# Remove the Fedora desktop defaults replaced by Neptuno's Flatpak-first
# application set. Keep fedora-logos out of this list: removing it would also
# remove GDM through its system-logo dependency.
[remove]
packages = [
    "default-fonts-cjk-sans",
    "fedora-bookmarks",
    "fedora-chromium-config",
    "fedora-chromium-config-gnome",
    "fedora-third-party",
    "firefox",
    "firefox-langpacks",
    "gnome-shell-extension-background-logo",
    "gnome-software",
    "gnome-software-rpm-ostree",
    "google-noto-sans-cjk-vf-fonts",
    "ptyxis",
    "totem-video-thumbnailer",
    "yelp",
]

[fedora]
# Fedora's build-essential equivalent; installs gcc and therefore /usr/bin/cc.
groups = ["c-development"]
packages = [
    # --- fonts --------------------------------------------------------------
    "adwaita-fonts-all",
    "jetbrains-mono-fonts-all",      # dev fonts (ported from neptuno)

    # --- terminal integration -----------------------------------------------
    "xdg-terminal-exec",

    # --- YubiKey / FIDO2 ----------------------------------------------------
    "pam-u2f",                       # FIDO2/U2F PAM auth module
    "pamu2fcfg",                     # FIDO2 credential enrollment tool
    "pam_yubico",                    # YubiKey OTP PAM module
    "ykpers",                        # YubiKey personalization tools
    "ykclient",                      # YubiKey client library
    "yubikey-manager",               # ykman CLI
    "python3-yubikey-manager",       # ykman python stack

    # --- networking / hardware ----------------------------------------------
    "firewall-config",               # firewall GUI (pulls firewalld; bluefin ships it)
    "tailscale",                     # private overlay network (used on neptuno)
    "brightnessctl",
    "playerctl",
    "NetworkManager-tui",
    "ddcutil",                       # monitor control (DMS brightness backend)
    "input-remapper",                # input remapping daemon
    "lm_sensors",
    "powertop",
    "smartmontools",
    "evtest",
    "libva-utils",                   # vainfo — VA-API verification
    "igt-gpu-tools",                 # intel_gpu_top & friends
    "libratbag-ratbagd",             # mouse configuration daemon
    "ifuse",                         # iPhone/iPad mounting (FUSE)
    "solaar-udev",                   # Logitech devices (udev rules only)

    # --- apps / helpers ------------------------------------------------------
    "nautilus-python",               # Python extension support for Nautilus
    "waypipe",
    "distrobox",                 # dev container workflow (bluefin standard)
    "cava",
    "qt6-qtmultimedia",
    "git-credential-libsecret",      # git × gnome-keyring credential helper
    "fastfetch",

    # --- theming / tray (wm-agnostic) ----------------------------------------
    "adw-gtk3-theme",
    "libappindicator-gtk3",
    "libayatana-appindicator-gtk3",
    "7zip-standalone",               # 7z CLI (FileRoller covers GUI only)
    "borgbackup",                    # dedup backup tool (RPM home)

    # --- shells (RPM, not brew: a login shell must exist before first login) --
    "fish",                          # default user shell
    "zsh",                           # alternate shell

    # --- finpilot housekeeping -----------------------------------------------
    "gum",                           # ujust interactive prompts dependency
    "just",                          # ujust recipe runner (ujust wrapper execs this binary)
    "tmux",                          # dnf cache smoke test (moved from 10-build.sh)
]

# --- default terminal (COPR) ------------------------------------------------
# ghostty is not in Fedora (COPR scottames/ghostty); default terminal via
# niri keybind + xdg-terminal-exec wiring in 40-niri.sh.
["copr:scottames/ghostty"]
packages = ["ghostty"]

# --- auto-updates (COPR) ---------------------------------------------------
# uupd (6h timer + AC trigger, config shared) enables background updates.
# oversteer-udev is COPR-only, not Fedora (rpm Vendor = "Fedora Copr").
["copr:ublue-os/packages"]
packages = ["uupd", "oversteer-udev"]
