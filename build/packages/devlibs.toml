# Host compilers (doc/product.md 5.3), so the host's cc is never Nix's: a
# binary linked by Nix's toolchain runs on Nix's glibc and can't load the
# host's Mesa. -devel packages are not in the image: `nx add openssl-devel`
# overlays them on /usr live, matched to the image's own libraries.

[fedora]
packages = [
    "gcc",
    "gcc-c++",
    "clang",                         # llvm-libs is already here for Mesa
    "make",
    "pkgconf-pkg-config",
]
