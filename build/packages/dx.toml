# Neptuno DX layer manifest — developer experience stack.
#
# Consumed by build/45-dx.sh via build/scripts/read-packages + package-lib.sh:
#   [fedora] -> install_fedora_section (one dnf5 transaction + assert)
#
# Scope: host-level dev tooling that wants to be in the image (daemons,
# device access, system services). User-level CLI tools belong in the
# Brewfile instead (finpilot-packages rule).
#
# Containers: podman, buildah, and skopeo ship with the Silverblue base and
# are the supported runtime here. The docker-ce daemon was removed from the
# image to keep it light (no dockerd, no docker.socket).
#
# Virtualization: the libvirt/qemu host stack was removed too. virt-manager
# was only ever a Flathub flatpak; install a VM toolchain through a
# distrobox/toolbox container if you need one.
#
# Sources: pre-Pluto Neptuno DX layer and a 2026-08-29 package audit.

[fedora]
packages = [
    # --- android (adb/fastboot) ---------------------------------------------
    "android-tools",
]
