# Neptuno DX layer manifest — developer experience stack.
#
# Consumed by build/45-dx.sh via build/scripts/read-packages + package-lib.sh:
#   [fedora] -> install_fedora_section (one dnf5 transaction + assert)
#   [docker] -> the docker-ce third-party repo section; 45-dx.sh enables the
#               official repo, installs, then REMOVES the repo file (updates
#               ride image rebuilds — unlike multimedia.toml, which
#               intentionally keeps negativo17 enabled).
#
# Scope: host-level dev tooling that wants to be in the image (daemons,
# device access, system services). User-level CLI tools belong in the
# Brewfile instead (finpilot-packages rule).
#
# The docker group is declared in sysusers.d via
# custom/files/usr/lib/sysusers.d/docker.conf (docker-ce's %pre groupadd
# trips bootc lint otherwise).
#
# Sources: 2026-08-29 package audit vs the neptuno host layer (host-proven
# pick set: docker-ce stack, adb, libvirt/qemu daemon trio).
#   - docker lives HERE (not brew): brew's docker formula is CLI-only — no
#     dockerd daemon. Bluefin's devmode setup has this exact gap (github.com
#     /ublue-os just/system.just INSTALL_DOCKER=1 -> `brew install docker`).
#   - virt-manager stays a Flathub flatpak (user installs it); only the host
#     daemon + client are native (bluefin dx precedent).
#   - virt-host-validate / storage pools: libvirt-client covers the CLI side;
#     qemu-kvm provides the /usr/libexec/qemu-kvm binary + KVM modules.

[fedora]
packages = [
    # --- android (adb/fastboot) ---------------------------------------------
    "android-tools",

    # --- virtualization: minimal host daemon (virt-manager is a flatpak) ----
    "libvirt-client",
    "libvirt-daemon-qemu",
    "qemu-kvm",
]

# docker-ce from the official repo: https://download.docker.com/linux/fedora
# (releasever pinned by the FEDORA_MAJOR_VERSION ARG — fc44 served, verified
# 2026-08-29). gpgkey https://download.docker.com/linux/fedora/gpg.
# Origin proof (asserted in 45-dx.sh): docker-ce* carry RPM VENDOR "Docker";
# containerd.io has an empty vendor but a docker-repo-unique NAME (Fedora
# ships `containerd`, no `.io` suffix), so presence-assert suffices.
[docker]
packages = [
    "docker-ce",
    "docker-ce-cli",
    "containerd.io",
    "docker-buildx-plugin",
    "docker-compose-plugin",
]
