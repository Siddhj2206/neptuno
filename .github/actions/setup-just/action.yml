name: Set up just
description: Install a pinned, checksum-verified just into /usr/local/bin.
runs:
  using: composite
  steps:
    - name: Install just
      shell: bash
      env:
        # renovate: datasource=github-releases depName=casey/just
        JUST_VERSION: "1.59.0"
      run: |
        set -euo pipefail
        base="https://github.com/casey/just/releases/download/${JUST_VERSION}"
        asset="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
        cd "${RUNNER_TEMP}"
        curl -sSfL --retry 5 --retry-all-errors -o "${asset}" "${base}/${asset}"
        curl -sSfL --retry 5 --retry-all-errors -o SHA256SUMS "${base}/SHA256SUMS"
        grep -F " ${asset}" SHA256SUMS | sha256sum -c -
        tar xzf "${asset}" just
        sudo install -m 0755 just /usr/local/bin/just
        just --version
