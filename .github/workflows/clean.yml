name: Clean

# Weekly retention (doc/product.md 12): keep the newest 30 dated builds with
# their cosign signatures, delete untagged digests and orphaned signature
# artifacts, and prune GitHub releases to match.
on:
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only report what would be deleted
        type: boolean
        default: true

permissions: {}

# Shares build.yml's main group, so it never prunes while a build publishes.
concurrency:
  group: build-refs/heads/main
  cancel-in-progress: false

jobs:
  images:
    name: Prune image versions
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      packages: write
    steps:
      - name: Prune GHCR
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: ${{ github.event.repository.name }}
          # The dated tags (45.YYYYMMDD) are the retention unit. `stable` and
          # `stable-testing` are the Bluefin-era image's; drop them from this
          # list a month after the cutover (doc/product.md 16.8).
          exclude-tags: latest,candidate,stable,stable-testing
          keep-n-tagged: 30
          delete-untagged: true
          delete-orphaned-images: true
          older-than: 14 days
          validate: true
          dry-run: ${{ inputs.dry-run || false }}
          token: ${{ github.token }}

  releases:
    name: Prune releases
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Keep the newest 30 releases
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run || false }}
        run: |
          set -euo pipefail
          gh release list -R "${GITHUB_REPOSITORY}" --limit 1000 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[30:] | .[].tagName' |
          while read -r tag; do
            echo "Deleting release ${tag}"
            [[ "${DRY_RUN}" == true ]] || gh release delete "${tag}" -R "${GITHUB_REPOSITORY}" --cleanup-tag --yes
          done
