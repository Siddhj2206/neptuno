name: ISO

# The offline installer ISO (doc/product.md 14), on demand. It embeds the
# published image, so it never rebuilds Neptuno: the payload is whatever
# :latest (or the chosen tag) points at, already signed and verified by
# build.yml. The ISO is about 4 GB, over the 2 GiB release-asset limit, so it
# is a short-lived workflow artifact.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to embed (it installs, then updates from :latest)
        type: string
        default: latest

permissions: {}

jobs:
  iso:
    name: Build installer ISO
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: ./.github/actions/setup-just

      # Ubuntu's root podman storage is not what osbuild can mount
      # (osbuild/bootc-image-builder#446); osbuild's own action resets it to
      # plain overlay storage the same way.
      - name: Configure root podman for osbuild
        run: |
          # Ubuntu's AppArmor restriction on user namespaces breaks osbuild's
          # bubblewrap sandbox (fchownat: Operation not permitted).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' |
            sudo tee /etc/containers/storage.conf >/dev/null

      - name: Pull payload
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "${TAG}" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::bad tag"; exit 1; }
          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY#*/}"
          ref="${ref,,}"
          sudo podman pull "${ref}:${TAG}"
          # The installed system follows :latest whatever build it starts from.
          sudo podman tag "${ref}:${TAG}" "${ref}:latest"
          echo "PAYLOAD=${ref}:latest" >> "${GITHUB_ENV}"

      - name: Build ISO
        run: just iso "${PAYLOAD}"

      - name: Checksum
        run: |
          cd output/iso
          find . -name '*.iso' -exec sha256sum {} + | tee SHA256SUMS

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neptuno-iso
          path: |
            output/iso/**/*.iso
            output/iso/SHA256SUMS
          compression-level: 0
          retention-days: 7
