# Neptuno's Nix settings, included from /etc/nix/nix.conf (20-overlay.sh adds
# the include, so Fedora's own file stays as the package ships it).

# nix's 1 MiB default stalls a download when unpacking falls behind; large
# NARs (compilers, browsers) hit it. 64 MiB per transfer is bounded by
# max-substitution-jobs (16), so at most 1 GiB, and only while downloading.
download-buffer-size = 67108864
