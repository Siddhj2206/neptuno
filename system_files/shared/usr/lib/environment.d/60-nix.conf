# Make Nix profile binaries and .desktop files visible to the whole session
# (keybinds, the DMS launcher, user units), not only to interactive shells.
# The system comes first on PATH: a Nix compiler (nx add clang) must not
# replace /usr/bin/cc, or builds link against Nix's glibc and can't load the
# host's Mesa. nx add warns when a command it installs is shadowed this way.
PATH=${PATH}:${HOME}/.nix-profile/bin:/nix/var/nix/profiles/default/bin
XDG_DATA_DIRS=${HOME}/.nix-profile/share:/nix/var/nix/profiles/default/share:${XDG_DATA_DIRS:-/usr/local/share/:/usr/share/}
