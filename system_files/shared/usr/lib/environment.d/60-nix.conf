# Make Nix profile binaries and .desktop files visible to the whole session
# (keybinds, the DMS launcher, user units), not only to interactive shells.
PATH=${HOME}/.nix-profile/bin:/nix/var/nix/profiles/default/bin:${PATH}
XDG_DATA_DIRS=${HOME}/.nix-profile/share:/nix/var/nix/profiles/default/share:${XDG_DATA_DIRS:-/usr/local/share/:/usr/share/}
# Let compilers link against libraries installed with nx (nx add libxkbcommon)
# without per-project flags. LIBRARY_PATH is searched after /usr/lib64, so a
# library the system ships still wins; Nix only fills the gaps.
LIBRARY_PATH=${HOME}/.nix-profile/lib${LIBRARY_PATH:+:${LIBRARY_PATH}}
