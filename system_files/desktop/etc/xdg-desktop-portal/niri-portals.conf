# Overrides /usr/share/xdg-desktop-portal/niri-portals.conf. Fedora's niri 26.04
# still routes Secret to gnome-keyring, which is not installed; oo7 owns the
# Secret Service (doc/product.md 6.2, 6.4). Drop this file once Fedora's niri
# carries upstream's oo7 line.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=oo7-portal;
