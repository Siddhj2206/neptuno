# Session environment for niri + DMS. A user file of the same name in
# ~/.config/environment.d replaces this one.
TERMINAL=ghostty
QT_QPA_PLATFORM=wayland;xcb
QT_QPA_PLATFORMTHEME=qt6ct
QT_QPA_PLATFORMTHEME_QT6=qt6ct
SDL_VIDEO_DRIVER=wayland,x11
ELECTRON_OZONE_PLATFORM_HINT=auto
MOZ_ENABLE_WAYLAND=1
GTK_USE_PORTAL=1
# Input method (6.5): GTK uses text-input-v3 directly; Qt and XWayland need these.
QT_IM_MODULE=ibus
XMODIFIERS=@im=ibus
# DMS privileged actions (greeter sync) go through sudo in a terminal (6.3).
# Not run0: it execs the command straight into unconfined_t, which SELinux
# refuses as an entrypoint for usermod and restorecon (exit 203/EXEC).
DMS_PRIVESC=sudo
# DMS forces this to 1 unless set; 0 keeps Qt's vsync-locked animation driver.
# Workaround for duxlabs-dev/dux-shell#3837; drop once that is fixed.
QSG_USE_SIMPLE_ANIMATION_DRIVER=0
