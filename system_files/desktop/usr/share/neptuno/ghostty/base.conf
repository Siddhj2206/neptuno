# Neptuno ghostty defaults. Replaced by every image update; put your own
# settings in ~/.config/ghostty/overrides.conf, which loads after this file.

font-size = 12

window-decoration = false
background-opacity = 0.9
gtk-titlebar = false
gtk-single-instance = true

mouse-hide-while-typing = true
copy-on-select = false
confirm-close-surface = false

shell-integration = detect
# No `sudo` feature: its wrapper runs `sudo TERMINFO=... cmd`, which sudo
# refuses under a narrow rule like /etc/sudoers.d/neptuno-bootc, and the
# ghostty package already installs xterm-ghostty in /usr/share/terminfo.
shell-integration-features = cursor,title,no-cursor

keybind = ctrl+shift+n=new_window
keybind = ctrl+shift+t=new_tab
keybind = ctrl+plus=increase_font_size:1
keybind = ctrl+minus=decrease_font_size:1
keybind = ctrl+zero=reset_font_size
keybind = shift+enter=text:\n
